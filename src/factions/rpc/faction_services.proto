syntax = "proto3";

package faction_services;

// The faction daemon's game calls, split into four services so that each
// piece fits a small server (see docs/faction_split.md). The faction daemon
// itself plans: each tick it takes a snapshot from each service, decides,
// then asks them to act. The services hold no state and make no decisions.
//
// Field names stay clear of the game's function names: the game charges RAM
// for any identifier matching one (a field named `run` or `share` would be
// charged as ns.run/ns.share wherever it's read).

message Empty {}

message Done {
  bool ok = 1;
  // Why not, when ok is false.
  string detail = 2;
}

// ---- FactionInfoService: augmentations, standing, favor --------------------

message Stat {
  string key = 1;
  double value = 2;
}

message Augmentation {
  string name = 1;
  double price = 2;
  double repReq = 3;
  repeated string prereqs = 4;
  repeated Stat stats = 5;
}

message FactionOffer {
  string faction = 1;
  repeated string augmentations = 2;
}

message Standing {
  string faction = 1;
  double rep = 2;
  double favor = 3;
}

message CompanyStanding {
  string company = 1;
  double rep = 2;
}

message InfoRequest {
  // Rep and favor for these (the joined factions).
  repeated string standingFactions = 1;
  // What these sell (joined, plus factions whose invite is wanted).
  repeated string offerFactions = 2;
  // Company rep for these employers.
  repeated string companies = 3;
}

message InfoSnapshot {
  repeated FactionOffer offers = 1;
  // Every augmentation in `offers`, plus every one owned but not installed.
  repeated Augmentation augmentations = 2;
  repeated Standing standings = 3;
  // Owned including bought-but-not-installed (getOwnedAugmentations(true)).
  repeated string ownedWithQueued = 4;
  // Installed only (getOwnedAugmentations(false)).
  repeated string installed = 5;
  double favorToDonate = 6;
  repeated CompanyStanding companyStandings = 7;
}

service FactionInfoService {
  rpc Snapshot (InfoRequest) returns (InfoSnapshot);
}

// ---- FactionWorkService: invites, work, jobs, travel, gym ------------------

message FactionRequirements {
  string faction = 1;
  // getFactionInviteRequirements' nested requirement tree, as JSON.
  string requirementsJson = 2;
}

message FactionWorkTypes {
  string faction = 1;
  repeated string types = 2;
}

message WorkRequest {
  repeated string requirementFactions = 1;
  repeated string workTypeFactions = 2;
}

message WorkSnapshot {
  repeated string invitations = 1;
  repeated FactionRequirements requirements = 2;
  // getCurrentWork() as JSON ("null" when idle).
  string currentWorkJson = 3;
  repeated FactionWorkTypes workTypes = 4;
}

message FactionRequest {
  string faction = 1;
}

message FactionWorkRequest {
  string faction = 1;
  string workType = 2;
}

message CompanyRequest {
  string company = 1;
  // The job field, for ApplyToCompany.
  string field = 2;
}

message JobReply {
  // The position hired or promoted to; empty if not.
  string job = 1;
}

message TravelRequest {
  string city = 1;
}

message GymRequest {
  string location = 1;
  // A GymType value ("str", "def", "dex", "agi").
  string gymType = 2;
}

service FactionWorkService {
  rpc Snapshot (WorkRequest) returns (WorkSnapshot);
  rpc Join (FactionRequest) returns (Done);
  rpc WorkForFaction (FactionWorkRequest) returns (Done);
  rpc ApplyToCompany (CompanyRequest) returns (JobReply);
  rpc WorkForCompany (CompanyRequest) returns (Done);
  rpc QuitJob (CompanyRequest) returns (Done);
  rpc Travel (TravelRequest) returns (Done);
  rpc Gym (GymRequest) returns (Done);
  rpc Stop (Empty) returns (Done);
}

// ---- CrimeService -----------------------------------------------------------

message CrimeInfo {
  string crime = 1;
  double karma = 2;
  double timeMs = 3;
  double kills = 4;
  double chance = 5;
}

message CrimeSnapshot {
  repeated CrimeInfo crimes = 1;
}

message CrimeRequest {
  string crime = 1;
}

service CrimeService {
  rpc Snapshot (Empty) returns (CrimeSnapshot);
  rpc Commit (CrimeRequest) returns (Done);
}

// ---- AugmentPurchaseService: buying, donating, installing ------------------

message PurchaseSnapshot {
  double homeRamCost = 1;
  // Stock positions held (long or short shares in any symbol); an install
  // deletes them with no refund. 0 without TIX API access.
  double positionsHeld = 2;
}

message PurchaseRequest {
  string faction = 1;
  string augmentation = 2;
}

message DonateRequest {
  string faction = 1;
  double amount = 2;
}

message HomeRamReply {
  // Upgrades bought this call, with what each cost and the RAM after it.
  repeated double costs = 1;
  double ramAfter = 2;
}

message InstallRequest {
  string bootScript = 1;
}

service AugmentPurchaseService {
  rpc Snapshot (Empty) returns (PurchaseSnapshot);
  rpc Purchase (PurchaseRequest) returns (Done);
  rpc Donate (DonateRequest) returns (Done);
  // Buys home RAM upgrades while cash covers them (at most 50).
  rpc UpgradeHomeRam (Empty) returns (HomeRamReply);
  rpc Install (InstallRequest) returns (Done);
}
