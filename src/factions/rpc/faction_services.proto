syntax = "proto3";

package faction_services;

// The faction daemon's game calls, as small services: each fits a 16 GB
// server (most are 6-13 GB), so they bin-pack onto whatever servers have
// room - early in a BitNode that's mostly 16 GB ones (docs/faction_split.md).
// The faction daemon plans: each tick it reads snapshots from the services,
// decides, then asks them to act. The services hold no state and make no
// decisions; each one's main script is generated from its block here plus
// its handlers module (services/<stem>_handlers.ts).
//
// Field names stay clear of the game's function names: the game charges RAM
// for any identifier matching one (a field named `run` or `share` would be
// charged as ns.run/ns.share wherever it's read).

message Empty {}

message Done {
  bool ok = 1;
  // Why not, when ok is false.
  string detail = 2;
}

message FactionsRequest {
  repeated string factions = 1;
}

message NamesRequest {
  repeated string names = 1;
}

// ---- AugCatalogService: what factions sell, at what price (11.6 GB) ---------

message FactionOffer {
  string faction = 1;
  repeated string augmentations = 2;
}

message AugPrice {
  string name = 1;
  double price = 2;
  double repReq = 3;
}

message CatalogRequest {
  repeated string factions = 1;
  // Also priced: augmentations no faction above sells (e.g. pending ones).
  repeated string extraNames = 2;
}

message CatalogSnapshot {
  repeated FactionOffer offers = 1;
  // Every augmentation in `offers`, plus extraNames.
  repeated AugPrice prices = 2;
}

service AugCatalogService {
  rpc Snapshot (CatalogRequest) returns (CatalogSnapshot);
}

// ---- AugDetailService: prerequisites and multipliers (11.6 GB) ---------------

message Stat {
  string key = 1;
  double value = 2;
}

message AugDetail {
  string name = 1;
  repeated string prereqs = 2;
  repeated Stat stats = 3;
}

message DetailSnapshot {
  repeated AugDetail details = 1;
}

service AugDetailService {
  rpc Snapshot (NamesRequest) returns (DetailSnapshot);
}

// ---- StandingService: owned augmentations, rep and favor (9.7 GB) ------------

message Standing {
  string faction = 1;
  double rep = 2;
  double favor = 3;
}

message CompanyStanding {
  string company = 1;
  double rep = 2;
}

message StandingRequest {
  repeated string factions = 1;
  repeated string companies = 2;
}

message StandingSnapshot {
  repeated Standing standings = 1;
  // Owned including bought-but-not-installed (getOwnedAugmentations(true)).
  repeated string ownedWithQueued = 2;
  // Installed only (getOwnedAugmentations(false)).
  repeated string installed = 3;
  double favorToDonate = 4;
  repeated CompanyStanding companyStandings = 5;
}

service StandingService {
  rpc Snapshot (StandingRequest) returns (StandingSnapshot);
}

// ---- InviteService: invitations, their requirements, joining (10.6 GB) -------

message FactionRequirements {
  string faction = 1;
  // getFactionInviteRequirements' nested requirement tree, as JSON.
  string requirementsJson = 2;
}

message InviteSnapshot {
  repeated string invitations = 1;
  repeated FactionRequirements requirements = 2;
}

message FactionRequest {
  string faction = 1;
}

service InviteService {
  rpc Snapshot (FactionsRequest) returns (InviteSnapshot);
  rpc Join (FactionRequest) returns (Done);
}

// ---- WorkService: the work slot - faction work, travel, gym, study (13.1 GB) -

message FactionWorkTypes {
  string faction = 1;
  repeated string types = 2;
}

message WorkSnapshot {
  // getCurrentWork() as JSON ("null" when idle).
  string currentWorkJson = 1;
  repeated FactionWorkTypes workTypes = 2;
}

message FactionWorkRequest {
  string faction = 1;
  string workType = 2;
}

message TravelRequest {
  string city = 1;
}

message GymRequest {
  string location = 1;
  // A GymType value ("str", "def", "dex", "agi").
  string gymType = 2;
}

message StudyRequest {
  string university = 1;
  string course = 2;
}

service WorkService {
  rpc Snapshot (FactionsRequest) returns (WorkSnapshot);
  rpc WorkForFaction (FactionWorkRequest) returns (Done);
  rpc Travel (TravelRequest) returns (Done);
  rpc Gym (GymRequest) returns (Done);
  rpc Study (StudyRequest) returns (Done);
  rpc Stop (Empty) returns (Done);
}

// ---- JobService: company jobs (10.6 GB) --------------------------------------

message CompanyRequest {
  string company = 1;
  // The job field, for ApplyToCompany.
  string field = 2;
}

message JobReply {
  // The position hired or promoted to; empty if not.
  string job = 1;
}

service JobService {
  rpc ApplyToCompany (CompanyRequest) returns (JobReply);
  rpc WorkForCompany (CompanyRequest) returns (Done);
  rpc QuitJob (CompanyRequest) returns (Done);
}

// ---- CrimeInfoService / CrimeService: crimes (11.6 / 6.6 GB) -----------------

message CrimeInfo {
  string crime = 1;
  double karma = 2;
  double timeMs = 3;
  double kills = 4;
  double chance = 5;
}

message CrimeSnapshot {
  repeated CrimeInfo crimes = 1;
}

message CrimeRequest {
  string crime = 1;
}

service CrimeInfoService {
  rpc Snapshot (Empty) returns (CrimeSnapshot);
}

service CrimeService {
  rpc Commit (CrimeRequest) returns (Done);
}

// ---- AugBuyService: buying augmentations and rep (11.6 GB) -------------------

message PurchaseRequest {
  string faction = 1;
  string augmentation = 2;
}

message DonateRequest {
  string faction = 1;
  double amount = 2;
}

service AugBuyService {
  rpc Purchase (PurchaseRequest) returns (Done);
  rpc Donate (DonateRequest) returns (Done);
}

// ---- InstallService: the install, and what it would lose (10.7 GB) ----------

message InstallSnapshot {
  // Stock positions held (long or short shares in any symbol); an install
  // deletes them with no refund. 0 without TIX API access.
  double positionsHeld = 1;
}

message InstallRequest {
  string bootScript = 1;
}

service InstallService {
  rpc Snapshot (Empty) returns (InstallSnapshot);
  rpc Install (InstallRequest) returns (Done);
}

// ---- HomeRamService: home RAM upgrades (6.2 GB) -------------------------------

message HomeRamReply {
  // Upgrades bought this call, with what each cost and the RAM after it.
  repeated double costs = 1;
  double ramAfter = 2;
}

service HomeRamService {
  // Buys home RAM upgrades while cash covers them (at most 50).
  rpc UpgradeHomeRam (Empty) returns (HomeRamReply);
}
