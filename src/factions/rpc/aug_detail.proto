syntax = "proto3";

package aug_detail;

import "faction_types.proto";

// AugDetailService: Augmentations' prerequisites and multipliers (11.6 GB).
// The faction daemon's game calls as small services - see docs/faction_split.md.

message GetDetailsRequest {
  repeated string names = 1;
}

message GetDetailsResponse {
  repeated faction_types.AugDetail details = 1;
}

service AugDetailService {
  rpc GetDetails (GetDetailsRequest) returns (GetDetailsResponse);
}
