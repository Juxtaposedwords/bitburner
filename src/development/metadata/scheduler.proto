syntax = "proto3";

package scheduler;

// The shared "what is home's effort going toward right now" concept - not
// necessarily owned by scheduler.ts alone. HACK, STOCK_TARGETING, and
// GROW_STATS all run scheduler.ts's identical HWGW batch loop; STOCK_TARGETING
// changes which target resolveTarget() picks, and GROW_STATS changes what the
// player does instead: study_daemon.ts keeps them in a university class,
// faction_daemon.ts gives up the work slot and holds installs, and
// share_daemon.ts idles (share only boosts faction/company rep). CRIME is a placeholder for a future, separate daemon that would watch
// this same config and do something with no relationship to hack/grow/weaken
// batching at all - defined now so the schema doesn't need another breaking
// change later, not implemented anywhere yet.
enum Approach {
  HACK = 0;
  GROW_STATS = 1;
  CRIME = 2;
  // Same HWGW batch loop as HACK, but resolveTarget() prefers a
  // stock-linked server we currently hold long (see stock_target_daemon.ts)
  // over target_selector.ts's plain money/security ranking, falling back to
  // that ranking when nothing qualifies. Deliberately a targeting-only
  // change, not a different batch strategy - see server_metadata.md.
  STOCK_TARGETING = 3;
  // Same HWGW batch loop and player work as HACK, but spending is steered
  // toward good augmentations: faction_daemon.ts saves for and buys only
  // the most expensive reachable augmentation that is The Red Pill or
  // raises a multiplier in its augmentationFocus, and every other spender
  // treats that savings target as its reserve (development/libraries/savings.ts).
  AUGMENTS = 4;
  // Sets up a gang (Source-File 2): while not in one, faction_daemon.ts
  // spends the player's work slot on whichever crime lowers karma fastest
  // until the gang karma requirement is met, and gang_daemon.ts creates the
  // gang with the first preferred gang faction joined. Batches run as in
  // HACK; once the gang exists, player work goes back to normal.
  GANG = 5;
}

message SchedulerConfig {
  optional Approach approach = 1;
  // Fraction of a target's max money stolen per batch (e.g. 0.1 = 10%).
  optional double hack_fraction = 2;
  // Gap, in milliseconds, between each of a batch's four actions finishing.
  optional double spacing_ms = 3;
  // Pin scheduler.ts to a specific host instead of re-reading
  // target_selector.ts's weights.txt top pick. Unset = auto (default).
  optional string target_override = 4;
  // Below this hacking level, home is included in the worker-host pool
  // too (see home_reserved_ram_gb) - early game, home may be the only
  // significant RAM source before enough is rooted/purchased elsewhere.
  // At or above this level, home reverts to fully reserved for
  // development, same as every other host stays reserved always.
  optional double home_fallback_hacking_level = 5;
  // How much of home's RAM stays off-limits even while the fallback
  // above is active, so there's always headroom left for development.
  optional double home_reserved_ram_gb = 6;
  // Let the scheduler tune hack_fraction itself (see hwgw.ts's
  // nextHackFraction): up while worker RAM use is below
  // target_utilization, down when batches stop fitting. hack_fraction is
  // then only the starting point; the live value is kept in
  // /var/scheduler_state.txt. A fixed 5% had left half the fleet idle and
  // earned ~6x less than 25% on the same target.
  optional bool auto_hack_fraction = 7;
  optional double target_utilization = 8;
  optional double max_hack_fraction = 9;
}

message GetSchedulerConfigRequest {}

message GetSchedulerConfigResponse {
  SchedulerConfig config = 1;
}

message PatchSchedulerConfigRequest {
  // Same "ignore undefined fields" merge semantics as PatchMetadata/
  // PatchPlayerMetadata - only fields actually set here overwrite
  // state.config. No key needed: there's only ever one scheduler config.
  SchedulerConfig config = 1;
}

message PatchSchedulerConfigResponse {}

// Unlike PlayerService (which rides on SupervisorService's port),
// scheduler.ts is its own daemon/process, so it runs its own rpc.NewServer
// on SchedulerServicePort (auto-assigned below, like every other service).
service SchedulerService {
  rpc GetSchedulerConfig(GetSchedulerConfigRequest) returns (GetSchedulerConfigResponse);
  rpc PatchSchedulerConfig(PatchSchedulerConfigRequest) returns (PatchSchedulerConfigResponse);
}
