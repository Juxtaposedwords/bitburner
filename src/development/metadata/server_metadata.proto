syntax = "proto3";

package server_metadata;

message HackingRequirements {
  optional double level = 1;
  optional double ports = 2;
}

message HackingPorts {
  optional bool ssh = 1;
  optional bool ftp = 2;
  optional bool smtp = 3;
  optional bool http = 4;
  optional bool sql = 5;
}
message HackingData {
  optional HackingRequirements requirements = 1;
  optional HackingPorts ports = 2;
}

// Lifecycle stage. Never sent by a client write (crawl_servers doesn't know
// the player's current hacking level or owned port-openers) - only ever
// computed live by ListServers from centrally-tracked player state, so it's
// never stale the way a stored/pushed value could be.
enum ServerStatus {
  DISCOVERED = 0;
  ROOTABLE = 1;
  ROOTED = 2;
  ELIGIBLE = 3;
}

// The core domain object remains clean
message Metadata {
  string hostname = 1;
  optional string organization = 2;
  optional string ip = 3;
  optional string pathFromHome = 4;
  optional double maxRam = 5;
  optional double ramAvailable = 6;
  optional double cpuCores = 7;
  optional bool purchasedByPlayer = 8;
  optional double securityLevel = 9;
  optional double minSecurityLevel = 10;
  optional double growthMultiplier = 11;
  optional bool hacked = 12;
  optional bool backdoorInstalled = 13;
  optional HackingData hacking = 14;
  optional double moneyAvailable = 15;
  optional double maxMoney = 16;
  optional ServerStatus status = 17;
}

// Explicit Request Wrappers
message UpdateMetadataRequest {
  Metadata server = 1;
}

message PatchMetadataRequest {
  Metadata server = 1;
}

// Outcome now travels as the RPC's transport-level RpcStatus (see rpc.ts) -
// success is RpcStatus.OK, a missing/unknown record is RpcStatus.NOT_FOUND,
// so these carry no payload of their own.
message UpdateMetadataResponse {}

message PatchMetadataResponse {}

message ListServersRequest {
  // Eligibility (rooted, has money, hacking level met) is a server-side
  // concept computed from centrally-tracked state, not re-derived by callers.
  optional bool eligibleOnly = 1;
}

message ListServersResponse {
  repeated Metadata servers = 1;
}

service SupervisorService {
  rpc UpdateMetadata(UpdateMetadataRequest) returns (UpdateMetadataResponse);
  rpc PatchMetadata(PatchMetadataRequest) returns (PatchMetadataResponse);
  rpc ListServers(ListServersRequest) returns (ListServersResponse);
}
